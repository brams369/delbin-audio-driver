name: Build Delbin Audio Driver

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install Windows Driver Kit (WDK)
      shell: pwsh
      run: |
        # Téléchargement et installation silencieuse du WDK pour Windows 11
        Write-Host "Téléchargement du WDK..."
        Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2196230" -OutFile "wdksetup.exe"
        Write-Host "Installation du WDK..."
        Start-Process -Wait -FilePath ".\wdksetup.exe" -ArgumentList "/quiet", "/norestart"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install lief pefile

    - name: Build driver with MSBuild
      run: |
         msbuild Delbin_Audio_Driver/build/delbin_audio.vcxproj /p:Configuration=Release /p:Platform=x64

    - name: Create driver package
      shell: pwsh
      run: |
        mkdir -p OutputPackage
        Copy-Item -Path "x64\Release\delbin_audio.sys" -Destination "OutputPackage/"
        Copy-Item -Path "driver\delbin_audio.inf" -Destination "OutputPackage/"

    - name: Upload driver package
      uses: actions/upload-artifact@v4
      with:
        name: Delbin-Audio-Driver-Package
        path: OutputPackage/

    - name: Build summary
      run: |
        echo "### Compilation réussie ! 🚀" >> $env:GITHUB_STEP_SUMMARY
        echo "Le package du pilote pour Intel Tiger Lake (PCI\VEN_8086&DEV_A0C8) a été généré avec succès." >> $env:GITHUB_STEP_SUMMARY
